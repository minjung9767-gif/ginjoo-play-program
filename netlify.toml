# Netlify 배포 설정
# 이 저장소를 Netlify에 연결하면, '우리 목소리 책' 앱(voice-book 폴더)을
# 사이트의 첫 화면(루트)으로 보여준다.
# 그래서 주소가 https://<내가정한이름>.netlify.app/ 로 바로 열린다.
# (앱 파일 경로가 모두 상대경로라, 하위폴더가 아닌 루트에서도 그대로 동작함)

[build]
  publish = "voice-book"
  # 빌드 과정이 없는 순수 HTML/JS라 build command 는 필요 없음.

# 서비스워커/매니페스트가 항상 최신으로 받아지도록 캐시를 짧게
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
